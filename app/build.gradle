plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.efremandrei.matzpen'
    compileSdk 35
    defaultConfig {
        applicationId 'com.efremandrei.matzpen'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('MATZPEN_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('MATZPEN_STORE_PASSWORD')
                keyAlias 'matzpen'
                keyPassword System.getenv('MATZPEN_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
